name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify frontend environment
        run: |
          if [ -z "$VITE_NEON_AUTH_URL" ] && ! grep -q "^VITE_NEON_AUTH_URL=" .env.production; then
            echo "Missing VITE_NEON_AUTH_URL. Set the GitHub repository variable or provide .env.production."
            exit 1
          fi
          if [ -z "$VITE_NEON_DATA_API_URL" ] && ! grep -q "^VITE_NEON_DATA_API_URL=" .env.production; then
            echo "Missing VITE_NEON_DATA_API_URL. Set the GitHub repository variable or provide .env.production."
            exit 1
          fi
        env:
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}

      - name: Export repository variables
        run: |
          if [ -n "$VITE_NEON_AUTH_URL" ]; then
            echo "VITE_NEON_AUTH_URL=$VITE_NEON_AUTH_URL" >> "$GITHUB_ENV"
          fi
          if [ -n "$VITE_NEON_DATA_API_URL" ]; then
            echo "VITE_NEON_DATA_API_URL=$VITE_NEON_DATA_API_URL" >> "$GITHUB_ENV"
          fi
          if [ -n "$VITE_ADMIN_EMAILS" ]; then
            echo "VITE_ADMIN_EMAILS=$VITE_ADMIN_EMAILS" >> "$GITHUB_ENV"
          fi
          if [ -n "$VITE_NEON_SCHEMAS" ]; then
            echo "VITE_NEON_SCHEMAS=$VITE_NEON_SCHEMAS" >> "$GITHUB_ENV"
          fi
        env:
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
          VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}
          VITE_NEON_SCHEMAS: ${{ vars.VITE_NEON_SCHEMAS }}

      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MRP frontend dashboard" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MRP</title>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("mrp:redirect");
        if (redirect) {
          sessionStorage.removeItem("mrp:redirect");
          window.history.replaceState(null, "", redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
